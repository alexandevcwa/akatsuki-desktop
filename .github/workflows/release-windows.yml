name: Build Windows Installers (NSIS & MSI)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (NSIS .exe + WiX .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust Stable Toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Build Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Windows Installers (NSIS + MSI + Portable)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Target all

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akatsuki-Desktop-Windows-x64-Installers
          path: |
            dist-windows/*.exe
            dist-windows/*.msi
            dist-windows/SHA256SUMS.txt
          if-no-files-found: error
